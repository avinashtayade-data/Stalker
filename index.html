<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockify</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div id="dark_nav_bar">
       <div id="dark_nav_inner_bar">
            <div id="logo_container">
                 <i class="fa-solid fa-chart-simple" id="stockify_icon"></i>
                 Stockify
            </div>
            <div id="middle_nav_bar_container">
                <div id="dashboard_container">
                <i class="fa-regular fa-house" id="dashboard_icon"></i>
                Dashboard
            </div>
            <div id="WatchList_container">
                <i class="fa-solid fa-star" id="WathcList_icon"></i>
                WatchList
            </div>
            <div id="Portfolio_container">
                <i class="fa-solid fa-briefcase" id="Portfolio_icon"></i>
                Portfolio
            </div>
            <div id="NewsPaper_container">
                <i class="fa-regular fa-newspaper" id="NewsPaper_icon"></i>
                News
            </div>
            </div>
           <div id="right_side_inner_nav_bar">
                 <div id="search_bar_container">
                      <input type="text"   class="input_feild_nav_bar" placeholder="Search Stock/Company ">
                 </div>
                 <div id="profile_icon_container">
                     <i class="fa-regular fa-circle-user" id="profile_icon"></i>
                 </div>
           </div>
       </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
